name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: todo

jobs:
  build:
    name: Build (${{ matrix.target_label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_label: linux-x86_64
            ext: ""
            archive: tar.gz
          - os: macos-14
            target_label: macos-arm64
            ext: ""
            archive: tar.gz
          - os: windows-latest
            target_label: windows-x86_64
            ext: ".exe"
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked

      - name: Prepare dist dir
        shell: bash
        run: mkdir -p dist

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          cp "target/release/${BIN_NAME}" "dist/${BIN_NAME}"
          chmod +x "dist/${BIN_NAME}"
          tar -C dist -czf "${BIN_NAME}-${{ matrix.target_label }}.tar.gz" "${BIN_NAME}"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\release\${env:BIN_NAME}${{ matrix.ext }}" "dist\${env:BIN_NAME}${{ matrix.ext }}"
          Compress-Archive -Path "dist\${env:BIN_NAME}${{ matrix.ext }}" -DestinationPath "${env:BIN_NAME}-${{ matrix.target_label }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target_label }}
          path: |
            *.tar.gz
            *.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List files
        shell: bash
        run: |
          set -euxo pipefail
          find dist -type f -maxdepth 2

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/**/*