[package]
name = "todo-cli"
description = "A simple command-line to-do list application in Rust."
authors = ["Joe Kim <joesm.genie@gmail.com>"]
version = "1.0.0"
edition = "2024"

[[bin]]
name = "todo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
tempfile = "3.27.0"
